<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Room Availability – Practice 12</title>
  <style>
    :root {
      --ink: #1d2433; --muted: #5a6478; --line: #d0d6e2; --bg: #f6f7fa; --card: #ffffff;
      --accent: #2b6cb0; --ok-bg: #e6f6ec; --ok-ink: #1e6b3a; --fail-bg: #fdecec; --fail-ink: #a61b1b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; color: var(--ink); background: var(--bg); line-height: 1.45; }
    main { max-width: 880px; margin: 0 auto; padding: 1rem; }
    h1 { font-size: 1.35rem; margin: .25rem 0; }
    .sub { color: var(--muted); margin: 0 0 1rem; }
    .layout { display: grid; gap: 1rem; grid-template-columns: 1fr; }
    @media (min-width: 720px) { .layout { grid-template-columns: 3fr 2fr; } }
    section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1rem; min-width: 0; }
    h2 { font-size: 1rem; margin: 0 0 .75rem; }
    .field { display: grid; gap: .3rem; margin-bottom: .85rem; }
    label { font-weight: 600; }
    .hint { color: var(--muted); font-size: .85rem; font-weight: 400; }
    input[type="text"] { width: 100%; font: inherit; padding: .6rem .7rem; border: 1px solid var(--line); border-radius: 8px; }
    input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .check { display: flex; align-items: center; gap: .5rem; font-weight: 600; margin-bottom: 1rem; min-height: 44px; }
    .check input { width: 1.25rem; height: 1.25rem; }
    button { font: inherit; font-weight: 600; width: 100%; min-height: 44px; border: 0; border-radius: 8px;
             background: var(--accent); color: #fff; cursor: pointer; }
    @media (min-width: 720px) { button { width: auto; padding: 0 1.5rem; } }
    #result { margin-top: 1rem; border-radius: 10px; }
    .verdict { font-size: 1.5rem; font-weight: 700; margin: 0; padding: .6rem .8rem; border-radius: 8px 8px 0 0; }
    .verdict.ok { background: var(--ok-bg); color: var(--ok-ink); }
    .verdict.fail { background: var(--fail-bg); color: var(--fail-ink); }
    .reason { margin: 0; padding: .6rem .8rem; border: 1px solid var(--line); border-top: 0; border-radius: 0 0 8px 8px;
              overflow-wrap: anywhere; }
    #bookings { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
    #bookings li { border: 1px solid var(--line); border-radius: 8px; padding: .5rem .7rem; font-variant-numeric: tabular-nums; }
    #bookings span { color: var(--muted); }
    .note { color: var(--muted); font-size: .85rem; margin: .75rem 0 0; }
  </style>
</head>
<body>
  <main>
    <h1>Room availability</h1>
    <p class="sub"><span id="room-name">Aurora Seminar Room (R101)</span> · current time <strong id="now">09:00</strong> · fictional data</p>

    <div class="layout">
      <section aria-labelledby="form-title">
        <h2 id="form-title">Check a time slot</h2>
        <!-- novalidate: every rule and message comes from the JS rule layer, not from browser validation -->
        <form id="check-form" novalidate>
          <div class="field">
            <label for="start">Start time <span class="hint">(HH:MM, 24-hour)</span></label>
            <input id="start" name="start" type="text" inputmode="numeric" placeholder="11:30" autocomplete="off" maxlength="40">
          </div>
          <div class="field">
            <label for="duration">Duration <span class="hint">(minutes, 1–120)</span></label>
            <input id="duration" name="duration" type="text" inputmode="numeric" placeholder="60" autocomplete="off" maxlength="40">
          </div>
          <label class="check"><input id="blocked" name="blocked" type="checkbox"> Room is blocked</label>
          <button id="check" type="submit">Check</button>
        </form>
        <div id="result" role="status" aria-live="polite" hidden></div>
      </section>

      <section aria-labelledby="bookings-title">
        <h2 id="bookings-title">Existing bookings (read-only)</h2>
        <ul id="bookings"></ul>
        <p class="note">Bookings are fixed constants. Checking never adds or changes a booking.</p>
      </section>
    </div>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
